<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <br />
    <p class="label">Relais Bezeichner<br>
                    Relais 1: %sRelay1Name%<br>
                    Relais 2: %sRelay2Name%<br>
                    Relais 3: %sRelay3Name%</p>
                    
    %CONFIGPLACEHOLDER%
    <script>
        function formToJson(form) {
            var jsonFormInfo = JSON.stringify
            ({
            wAP_SSID: form.SSID.value,
            wAP_IP: form.IP.value,
            wAP_Password: form.Password.value,
            wRelay1Name: form.Relay1Name.value,
            wRelay2Name: form.Relay2Name.value,
            wRelay3Name: form.Relay3Name.value,
            n2kDebug: form.n2kDebug.checked,
            acceptBroadcastCommands: form.acceptBroadcastCommands ? form.acceptBroadcastCommands.checked : false
            });

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "/settings.html", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var statusEl = document.getElementById('status');
                    if (xhr.status === 200) {
                        statusEl.style.color = 'green';
                        statusEl.innerText = 'Gespeichert!';
                    } else {
                        statusEl.style.color = 'red';
                        statusEl.innerText = 'Fehler beim Speichern!';
                    }
                }
            };
            xhr.send(jsonFormInfo);
            return false; // Verhindert das Neuladen der Seite
    }
    </script>

    <p class="label">Nach &Auml;nderungen neu starten!</p>

    <button class="button" onclick="reboot_handler()">Neustart</button>

    <p id="status"></p>
    <script>
        function reboot_handler() 
        {
        document.getElementById("status").innerHTML = "Starte Reboot ...";
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/reboot", true);
        xhr.send();
        setTimeout(function(){ window.open("/reboot","_self"); }, 500);
        }
    </script>


    <ul class="bottomnav">

        <li><a class="active" href="settings.html">Settings</a></li>
        <li><a href="system.html">System</a></li>
        <li class="right"><a href="ueber.html">About</a></li>
    </ul>
</body>
</html >
